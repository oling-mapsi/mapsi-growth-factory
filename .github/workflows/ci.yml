name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mapsi_growth_factory_test
          POSTGRES_USER: mapsi
          POSTGRES_PASSWORD: mapsi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mapsi -d mapsi_growth_factory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mapsi_growth_factory_test
          MYSQL_USER: mapsi
          MYSQL_PASSWORD: mapsi
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umapsi -pmapsi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run contract checks
        run: make contracts-check
      - name: Run unit and API tests
        run: pytest -m "not postgres"
      - name: Run PostgreSQL migration and append-only tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://mapsi:mapsi@localhost:5433/mapsi_growth_factory_test
        run: |
          alembic -x db_url=$TEST_DATABASE_URL upgrade head
          pytest -m postgres
      - name: Run MySQL migration and append-only tests
        env:
          TEST_DATABASE_URL: mysql+pymysql://mapsi:mapsi@127.0.0.1:3307/mapsi_growth_factory_test?charset=utf8mb4
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators=1"
          alembic -x db_url=$TEST_DATABASE_URL upgrade head
          pytest -m mysql
